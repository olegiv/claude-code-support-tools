name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Prevent concurrent runs on same PR to avoid race conditions
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Security: Only review PRs from trusted contributors
    # This prevents prompt injection attacks via malicious PR content
    # See: https://www.aikido.dev/blog/promptpwnd-github-actions-ai-agents
    if: |
      github.event.pull_request.user.type == 'User' &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write  # Required for PR comments
      issues: read
      id-token: write

    steps:
      # Security: Prevent secret exposure in debug mode (SEC-002)
      - name: Verify security conditions
        run: |
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            echo "::error::Debug mode is enabled. Workflow aborted to prevent secret exposure."
            exit 1
          fi

      # Security: Audit logging for secret access (SEC-004)
      - name: Log secret access
        run: |
          echo "::notice::Claude Code OAuth token accessed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::notice::Workflow: ${{ github.workflow }}"
          echo "::notice::Actor: ${{ github.actor }}"
          echo "::notice::Event: ${{ github.event_name }}"
          echo "::notice::Ref: ${{ github.ref }}"
          echo "::notice::Run ID: ${{ github.run_id }}"
        env:
          TOKEN_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

      - name: Checkout repository
        # Security: Pin to commit SHA to prevent supply chain attacks (GHA-002)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Security: Pin to commit SHA to prevent supply chain attacks (GHA-002)
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590  # v1.0.230
        env:
          # Security: Use environment variables instead of direct expression interpolation
          # This prevents potential expression injection attacks
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          # Security: Long-lived token - rotate every 90 days (see SECURITY.md for policy)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Please review pull request #${{ env.REVIEW_PR_NUMBER }} in repository ${{ env.REVIEW_REPO }}.

            Review only the lines this pull request changes (`gh pr diff`); read surrounding code for context only.
            Report only high-confidence problems in correctness, security, or data handling that the change
            introduces. For each one, cite `file:line` and the concrete scenario in which it fails. Skip style,
            naming, formatting, speculative hardening, and pre-existing issues in unchanged code. Read the existing
            review comments first (`gh pr view --comments`) and do not repeat anything already raised. One finding
            per root cause. If nothing qualifies, say so in one sentence.

            Use the repository's CLAUDE.md for guidance on conventions.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # Security: Restrict Claude's tools to read-only operations plus PR comments
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Read(*),Glob(*),Grep(*)"'

