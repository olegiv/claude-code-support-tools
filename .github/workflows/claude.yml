name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Prevent concurrent runs on same issue/PR to avoid race conditions
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude:
    # Security: Only allow trusted users (OWNER, MEMBER, COLLABORATOR) to trigger Claude
    # This prevents prompt injection attacks from external contributors.
    # Each event branch validates the association of THAT event's own actor
    # (comment / review / issue author). Do NOT flatten these into a single
    # shared OR of all three associations: for an issue_comment event the
    # payload carries both .comment (the commenter) and .issue (the original
    # author), so an untrusted user commenting on a trusted user's issue/PR
    # would satisfy a shared OR via github.event.issue.author_association and
    # bypass the gate. Keep the association check inside each event branch.
    # See: https://www.aikido.dev/blog/promptpwnd-github-actions-ai-agents
    if: |
      github.event.sender.type == 'User' &&
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write  # Required for PR comments
      issues: write         # Required for issue comments
      id-token: write
      actions: read         # Required for Claude to read CI results on PRs

    steps:
      # Security: Prevent secret exposure in debug mode (SEC-002)
      - name: Verify security conditions
        run: |
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            echo "::error::Debug mode is enabled. Workflow aborted to prevent secret exposure."
            exit 1
          fi

      # Security: Audit logging for secret access (SEC-004)
      - name: Log secret access
        run: |
          echo "::notice::Claude Code OAuth token accessed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::notice::Workflow: ${{ github.workflow }}"
          echo "::notice::Actor: ${{ github.actor }}"
          echo "::notice::Event: ${{ github.event_name }}"
          echo "::notice::Ref: ${{ github.ref }}"
          echo "::notice::Run ID: ${{ github.run_id }}"
        env:
          TOKEN_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

      - name: Checkout repository
        # Security: Pin to commit SHA to prevent supply chain attacks (GHA-002)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Security: Pin to commit SHA to prevent supply chain attacks (GHA-002)
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464  # v1.0.159
        with:
          # Security: Long-lived token - rotate every 90 days (see SECURITY.md for policy)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Security: Restrict Claude's tools to prevent unauthorized actions
          # This mitigates prompt injection attacks (PromptPwnd vulnerability class)
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh search:*),Read(*),Write(*),Edit(*),Glob(*),Grep(*)"'

